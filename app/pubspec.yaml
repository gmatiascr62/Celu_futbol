name: celu_futbol
description: "Celu Fútbol: el simulador de fútbol argentino, en el celu."
publish_to: 'none'

version: 2.0.0+20

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/datos/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fuentes/Inter-Regular.ttf
        - asset: assets/fuentes/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Inter-Bold.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fuentes/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fuentes/BarlowCondensed-Bold.ttf
          weight: 700
